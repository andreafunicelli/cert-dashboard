name: CI
# Fast gate. This job is the required check on `main`: it must answer in a few minutes,
# because every factory card waits on it. The long suite lives in `integration.yml`,
# which runs after merge, nightly, and on pull requests that touch high-risk paths.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      # The production files are what operators actually run, and CI used to render only the test
      # compose. A YAML flow sequence in `tmpfs` (`tmpfs: [/tmp:noexec,nosuid,...]`) renders five
      # entries, which `config --quiet` accepts and only the daemon rejects at `up`.
      - name: Production compose renders
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose --profile migrate -f docker-compose.yml -f docker-compose.migrate.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.credentials.yml config --quiet
      - name: Production compose tmpfs entries are absolute mount targets
        run: |
          docker compose -f docker-compose.yml config --format json > /tmp/prod-compose.json
          uv run python - <<'PY'
          import json

          with open("/tmp/prod-compose.json", encoding="utf-8") as handle:
              services = json.load(handle)["services"]
          entries = [(name, spec) for name, service in services.items() for spec in service.get("tmpfs") or []]
          assert entries, "the production compose declares no tmpfs entries"
          fragments = [(name, spec) for name, spec in entries if not spec.startswith("/")]
          assert not fragments, f"tmpfs entries are not absolute mount targets: {fragments}"
          print("rendered tmpfs entries:", entries)
          PY
      - run: docker compose -f docker-compose.test.yml config --quiet
      # Everything that needs no database, no docker target and no SSH fixture: tests/unit plus the
      # preview and styling contract tests at the root of tests/. Integration lives in the other workflow.
      - name: DB-free suite with coverage for the security-critical paths
        run: |
          uv run pytest -q --ignore=tests/integration --cov=app --cov-report=json --cov-report=
          uv run coverage report --fail-under=85 --include='app/crypto/*'
          uv run coverage report --fail-under=85 --include='app/ansible/parse_*'
      - run: uv run pip-audit
