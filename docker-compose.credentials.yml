# Opt in only after provisioning these worker credentials. Remove unused entries.
services:
  worker:
    secrets:
      - source: ansible_ssh_key
      - source: ansible_vault_password
      - source: inventory_git_token
      - source: smtp_password
    volumes:
      - /etc/cert-dashboard/known_hosts:/etc/ssh/ssh_known_hosts:ro
    environment:
      ANSIBLE_HOST_KEY_CHECKING: "True"
      ANSIBLE_SSH_ARGS: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/ssh/ssh_known_hosts"

secrets:
  ansible_ssh_key:
    file: /etc/cert-dashboard/secrets/ansible_ssh_key
  ansible_vault_password:
    file: /etc/cert-dashboard/secrets/ansible_vault_password
  inventory_git_token:
    file: /etc/cert-dashboard/secrets/inventory_git_token
  smtp_password:
    file: /etc/cert-dashboard/secrets/smtp_password
