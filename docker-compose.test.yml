name: cert-dashboard-test

# Shared shape of the SSH-enabled targets (profile ssh-targets): init process, dedicated bridge network, no secrets,
# no extra privileges. Each service adds its image, vhost set, ports and fixture bind.
x-ssh-target: &ssh-target
  profiles: [ssh-targets]
  init: true
  networks: [ssh-targets]
x-ssh-target-health: &ssh-target-health
  interval: 2s
  timeout: 5s
  retries: 30
  start_period: 5s

services:
  db:
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    environment:
      POSTGRES_USER: db_owner
      POSTGRES_DB: cert_dashboard
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password, db_password]
    volumes:
      - ./app/migrations/init_roles.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U db_owner -d cert_dashboard"]
      interval: 2s
      timeout: 5s
      retries: 30
  migrate:
    image: cert-dashboard:local
    build:
      context: .
      target: runtime
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: db_owner
      DB_NAME: cert_dashboard
    command: [alembic, upgrade, head]
    secrets:
      - source: db_owner_password
        target: db_password
    depends_on:
      db:
        condition: service_healthy
  app:
    image: cert-dashboard:test
    build:
      context: .
      target: test
    user: "10001:10001"
    environment:
      DB_HOST: db
      DB_USER: app_role
      DB_NAME: cert_dashboard
    command: [pytest, -q, tests/unit, -p, "no:cacheprovider"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    secrets: [master_key, db_password, session_secret]
  tls-nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    profiles: [targets]
    volumes:
      - ./tests/fixtures/targets/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_TARGET_DIR:-./secrets/test/tls-targets}/tls-nginx:/etc/certs:ro
    ports: ["127.0.0.1::8443"]
  tls-apache:
    image: httpd:2.4-alpine@sha256:070da7661f0be8a05430b2c125c0cde9e53176b4048c813024021969a0e3893c
    profiles: [targets]
    volumes:
      - ./tests/fixtures/targets/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ${TLS_TARGET_DIR:-./secrets/test/tls-targets}/tls-apache:/etc/certs:ro
    ports: ["127.0.0.1::8443"]
  smtp:
    image: cert-dashboard:test
    profiles: [targets]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/spool]
    command: [python, -m, tests.fixtures.smtp_capture, --listen, "0.0.0.0:1025", --spool, /spool]
    ports: ["127.0.0.1::1025"]
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 1025), 3).close()"]
      interval: 2s
      timeout: 5s
      retries: 30

  # SSH-enabled nginx/Apache targets for the discovery and deployment tests (Plan 3): real sshd, real webserver,
  # built by a CI setup step (`build ssh-nginx-1 ssh-apache`) and started with --no-build --pull never.
  ssh-nginx-1:
    <<: *ssh-target
    image: cert-dashboard-target:nginx
    build:
      context: ./tests/fixtures/targets
      args:
        WEBSERVER: nginx
    environment:
      TARGET_CONFIG: nginx/one
      TARGET_TLS_PORT: "18443"
    volumes:
      - ${SSH_TARGET_DIR:-./secrets/test/ssh-targets}/ssh-nginx-1:/fixture:ro
    ports: ["127.0.0.1::22", "127.0.0.1:18443:18443"]
    healthcheck:
      <<: *ssh-target-health
      test: [CMD-SHELL, "pgrep -x sshd >/dev/null && pgrep -x nginx >/dev/null"]
  ssh-nginx-2:
    <<: *ssh-target
    image: cert-dashboard-target:nginx
    environment:
      TARGET_CONFIG: nginx/two
      TARGET_TLS_PORT: "18444"
    volumes:
      - ${SSH_TARGET_DIR:-./secrets/test/ssh-targets}/ssh-nginx-2:/fixture:ro
    ports: ["127.0.0.1::22", "127.0.0.1:18444:18444"]
    healthcheck:
      <<: *ssh-target-health
      test: [CMD-SHELL, "pgrep -x sshd >/dev/null && pgrep -x nginx >/dev/null"]
  ssh-apache:
    <<: *ssh-target
    image: cert-dashboard-target:apache
    build:
      context: ./tests/fixtures/targets
      args:
        WEBSERVER: apache
    environment:
      TARGET_CONFIG: apache
      TARGET_TLS_PORT: "18445"
    volumes:
      - ${SSH_TARGET_DIR:-./secrets/test/ssh-targets}/ssh-apache:/fixture:ro
    ports: ["127.0.0.1::22", "127.0.0.1:18445:18445"]
    healthcheck:
      <<: *ssh-target-health
      test: [CMD-SHELL, "pgrep -x sshd >/dev/null && pgrep -x apache2 >/dev/null"]

networks:
  ssh-targets:
    driver: bridge

secrets:
  master_key:
    file: ${TEST_SECRETS_DIR:-./secrets/test}/master_key
  db_password:
    file: ${TEST_SECRETS_DIR:-./secrets/test}/db_password
  db_owner_password:
    file: ${TEST_SECRETS_DIR:-./secrets/test}/db_owner_password
  session_secret:
    file: ${TEST_SECRETS_DIR:-./secrets/test}/session_secret
