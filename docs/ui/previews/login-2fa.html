</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header"><a class="brand" href="/">Cert Dashboard</a>
  <nav aria-label="Main">

<main id="main-content" tabindex="-1">
<section class="panel narrow auth-panel">
  <h1>Two-factor verification</h1>
  <p>Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
  
  <form method="post" action="/login/2fa">
    <input type="hidden" name="csrf_token" value="preview-only-not-a-valid-token">
    <label for="code">Code</label>
    <input id="code" class="mono" name="code" maxlength="128" autocomplete="one-time-code" inputmode="text" required autofocus>
    <button type="submit">Verify</button>
  </form>
  <form method="post" action="/logout" class="inline">
    <input type="hidden" name="csrf_token" value="preview-only-not-a-valid-token">
    <button type="submit" class="link">Cancel and sign out</button>
  </form>
  <p class="hint">Lost your device and codes? Contact another admin.</p>
</section>
</main>

</body>
</html>
