
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · Cert Dashboard</title>
  <link rel="stylesheet" href="../../../app/static/app.css">
  <script src="../../../app/static/htmx.min.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header"><a class="brand" href="/">Cert Dashboard</a>
  <nav aria-label="Main">

    <span><a href="/">Overview</a></span>


    <span><a href="/certificates">Certificates</a></span>


    <span><a href="/servers">Servers</a></span>


    <span><a href="/deploy">Deploy</a></span>


    <span><a href="/scans">Scans</a></span>


    <span><a href="/audit">Audit</a></span>


    <span><a href="/settings">Settings</a></span>


  </nav>

</header>






<main id="main-content" tabindex="-1">
<section class="panel narrow auth-panel">
  <h1>Sign in</h1>
  <p class="form-error" role="alert"><svg class="status-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/>

</svg> Invalid credentials.</p>
  <form method="post" action="/login" autocomplete="on">
    <input type="hidden" name="csrf_token" value="preview-only-not-a-valid-token">
    <label for="username">Username</label>
    <input id="username" name="username" value="operator" maxlength="254" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <p class="hint">There is no password reset. If you cannot sign in, contact another admin.</p>
</section>
</main>

</body>
</html>
