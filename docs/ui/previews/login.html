
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Sign in · Cert Dashboard</title>
  <link rel="stylesheet" href="../../../app/static/app.css">
  <script src="../../../app/static/htmx.min.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header"><a class="brand" href="/">Cert Dashboard</a>
  <nav aria-label="Main">
  
    <a href="/">Overview</a>
    
  
    <a href="/certificates">Certificates</a>
    
  
    <a href="/servers">Servers</a>
    
  
    <a href="/deploy">Deploy</a>

  </nav>
  
</header>






<main id="main-content" tabindex="-1">
<section class="panel narrow auth-panel">
  <h1>Sign in</h1>
  
  <form method="post" action="/login" autocomplete="on">
    <input type="hidden" name="csrf_token" value="preview-only-not-a-valid-token">
    <label for="username">Username</label>
    <input id="username" name="username" value="" maxlength="254" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <p class="hint">There is no password reset. If you cannot sign in, contact another admin.</p>
</section>
</main>

</body>
</html>
