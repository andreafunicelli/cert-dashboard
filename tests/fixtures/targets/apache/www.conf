# www.example.internal on web03: TLS on 18445 with a separate chain file, plus a plain :80 vhost (no binding).
<VirtualHost *:18445>
    ServerName www.example.internal
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/www.crt
    SSLCertificateKeyFile /etc/apache2/ssl/www.key
    SSLCertificateChainFile /etc/apache2/ssl/www.chain.pem
</VirtualHost>

<VirtualHost *:80>
    ServerName www.example.internal
    DocumentRoot /var/www/html
</VirtualHost>
