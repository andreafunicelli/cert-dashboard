# Test-only TLS target (docker-compose.test.yml, profile "targets"); never used outside the test stack.
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;

    server {
        listen 8443 ssl;
        ssl_certificate     /etc/certs/fullchain.pem;
        ssl_certificate_key /etc/certs/key.pem;
        location / {
            return 204;
        }
    }
}
