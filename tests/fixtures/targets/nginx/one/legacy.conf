# legacy.example.internal on web01: shares www.crt with the www vhost but has its own key file.
server {
    listen 18443 ssl;
    server_name legacy.example.internal;

    ssl_certificate     /etc/nginx/ssl/www.crt;
    ssl_certificate_key /etc/nginx/ssl/legacy.key;

    location / {
        return 204;
    }
}
