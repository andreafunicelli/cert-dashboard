# www.example.internal on web01 (committed test config; the TLS material is installed from /fixture/tls).
server {
    listen 18443 ssl;
    server_name www.example.internal;

    ssl_certificate     /etc/nginx/ssl/www.crt;
    ssl_certificate_key /etc/nginx/ssl/www.key;

    location / {
        return 204;
    }
}
